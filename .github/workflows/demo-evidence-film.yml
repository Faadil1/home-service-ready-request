name: Gate 6.75 Demo Evidence Film

on:
  push:
    branches: [build/blue-carbon-margin-tabs]
    paths:
      - qa/live-evidence-film.mjs
      - docs/DEMO_NARRATIVE_001.md
      - .github/workflows/demo-evidence-film.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-evidence-film:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_URL: https://home-service-ready-request.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Capture validated live evidence film
        run: node qa/live-evidence-film.mjs

      - name: Upload Gate 6.75 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-6-75-live-evidence-film
          path: gate-6-75-evidence/
          if-no-files-found: warn
